name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Submódulos del motor (sin CUDA)
        run: tools/native/init-submodules.sh

      - name: NDK y CMake fijados
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "cmake;4.1.2"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Pruebas de las herramientas Python
        run: |
          (cd tools/bench && python -m unittest -v)
          (cd tools/models && python -m unittest -v test_convert_opus test_fetch_firefox)
          (cd tools/catalog && python -m unittest -v)

      - name: Lint, pruebas y APKs
        run: ./gradlew --no-daemon lint test assembleFdroidRelease assemblePlayRelease

      # Lista exacta: cualquier permiso nuevo en el manifest fusionado de release rompe el CI.
      # DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION es interno de AndroidX (firma, sin capacidades).
      - name: El manifest fusionado solo pide los permisos permitidos
        run: |
          files=$(find app/build/intermediates -path '*Release*' -name AndroidManifest.xml)
          test -n "$files"
          permitidos="android.permission.INTERNET
          android.permission.FOREGROUND_SERVICE
          android.permission.FOREGROUND_SERVICE_DATA_SYNC
          android.permission.POST_NOTIFICATIONS
          android.permission.WAKE_LOCK
          android.permission.ACCESS_NETWORK_STATE
          io.github.diegobr4nd.lectorbilingue.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          encontrados=$(for f in $files; do tr -d '\n' < "$f" | grep -oE '<uses-permission[^>]*>' | grep -oE 'android:name="[^"]*"' | sed -e 's/^android:name="//' -e 's/"$//'; done | sort -u)
          echo "Permisos encontrados:"
          echo "$encontrados"
          sobrantes=$(echo "$encontrados" | grep -v -x -F "$(echo "$permitidos" | sed 's/^ *//')" | grep -v '^$' || true)
          if [ -n "$sobrantes" ]; then
            echo "::error::Permisos fuera de la lista permitida en el manifest fusionado"
            echo "$sobrantes"
            exit 1
          fi

      - name: El APK release trae los motores arm64
        run: |
          apk=app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libct2bridge.so"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libslimtbridge.so"

      - name: Reporte de verificación de dependencias (si falló)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-verification-report
          path: build/reports/dependency-verification/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-fdroid-release-unsigned
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          if-no-files-found: error
