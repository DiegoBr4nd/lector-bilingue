name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Submódulos del motor (sin CUDA)
        run: tools/native/init-submodules.sh

      - name: NDK y CMake fijados
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "cmake;4.1.2"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Pruebas de las herramientas Python
        run: |
          (cd tools/bench && python -m unittest -v test_html_to_txt)
          (cd tools/models && python -m unittest -v test_convert_opus)

      - name: Lint, pruebas y APKs
        run: ./gradlew --no-daemon lint test assembleFdroidRelease assemblePlayRelease

      # AndroidX inyecta este permiso interno (firma, sin capacidades); quitarlo rompe registerReceiver en API < 33.
      - name: El manifest fusionado no pide permisos (salvo el interno de AndroidX)
        run: |
          files=$(find app/build/intermediates -path '*Release*' -name AndroidManifest.xml)
          test -n "$files"
          permitido="io.github.diegobr4nd.lectorbilingue.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          sobrantes=$(grep -H "uses-permission" $files | grep -v -F "$permitido" || true)
          if [ -n "$sobrantes" ]; then
            echo "::error::Apareció un permiso en el manifest fusionado"
            echo "$sobrantes"
            exit 1
          fi

      - name: El APK release trae el motor arm64
        run: unzip -l app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk | grep -q "lib/arm64-v8a/libct2bridge.so"

      - name: Reporte de verificación de dependencias (si falló)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-verification-report
          path: build/reports/dependency-verification/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-fdroid-release-unsigned
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          if-no-files-found: error
