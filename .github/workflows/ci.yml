name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Submódulos del motor (sin CUDA)
        run: tools/native/init-submodules.sh

      - name: NDK y CMake fijados
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "cmake;4.1.2"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Pruebas de las herramientas Python
        run: |
          (cd tools/bench && python -m unittest -v)
          (cd tools/models && python -m unittest -v test_convert_opus test_fetch_firefox)
          (cd tools/catalog && python -m unittest -v)

      - name: Lint, pruebas y APKs
        run: ./gradlew --no-daemon lint test assembleFdroidRelease assemblePlayRelease bundlePlayRelease assemblePlayPrueba

      # La lista de licencias de las librerías está en el repo (assets/licencias/librerias.json). Si alguien cambia
      # dependencias sin regenerarla, este paso falla: regenerar con el comando de docs/build.md.
      - name: La lista de licencias está al día
        run: |
          ./gradlew --no-daemon :app:exportLibraryDefinitions -PaboutLibraries.exportVariant=playRelease
          git diff --exit-code -- app/src/main/assets/licencias/librerias.json

      # Lista exacta: cualquier permiso nuevo en el manifest fusionado de release rompe el CI.
      # DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION es interno de AndroidX (firma, sin capacidades).
      - name: El manifest fusionado solo pide los permisos permitidos
        run: |
          files=$(find app/build/intermediates \( -path '*Release*' -o -path '*Prueba*' \) -name AndroidManifest.xml)
          test -n "$files"
          permitidos="android.permission.INTERNET
          android.permission.FOREGROUND_SERVICE
          android.permission.FOREGROUND_SERVICE_DATA_SYNC
          android.permission.POST_NOTIFICATIONS
          android.permission.WAKE_LOCK
          android.permission.ACCESS_NETWORK_STATE
          io.github.diegobr4nd.lectorbilingue.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
          io.github.diegobr4nd.lectorbilingue.prueba.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          encontrados=$(for f in $files; do tr -d '\n' < "$f" | grep -oE '<uses-permission[^>]*>' | grep -oE 'android:name="[^"]*"' | sed -e 's/^android:name="//' -e 's/"$//'; done | sort -u)
          echo "Permisos encontrados:"
          echo "$encontrados"
          sobrantes=$(echo "$encontrados" | grep -v -x -F "$(echo "$permitidos" | sed 's/^ *//')" | grep -v '^$' || true)
          if [ -n "$sobrantes" ]; then
            echo "::error::Permisos fuera de la lista permitida en el manifest fusionado"
            echo "$sobrantes"
            exit 1
          fi

      # Reglas de Play para el AAB (spec 6b §3). Cada grep tiene control positivo: sin AAB, el paso falla.
      - name: El AAB cumple las reglas de Play
        run: |
          aab=app/build/outputs/bundle/playRelease/app-play-release.aab
          test -f "$aab" || { echo "::error::No existe el AAB"; exit 1; }
          unzip -l "$aab" > "$RUNNER_TEMP/aab.txt"
          grep -q "base/lib/arm64-v8a/libct2bridge.so" "$RUNNER_TEMP/aab.txt"
          grep -q "base/lib/arm64-v8a/libslimtbridge.so" "$RUNNER_TEMP/aab.txt"
          if grep -E "base/lib/" "$RUNNER_TEMP/aab.txt" | grep -v "arm64-v8a" | grep -q .; then echo "::error::ABI distinta de arm64"; exit 1; fi
          if grep -q "readium/divina" "$RUNNER_TEMP/aab.txt"; then echo "::error::Divina en el AAB"; exit 1; fi
          unzip -p "$aab" 'base/dex/*.dex' > "$RUNNER_TEMP/aabdex.bin"
          unzip -p "$aab" base/resources.pb > "$RUNNER_TEMP/aabres.bin"
          test -s "$RUNNER_TEMP/aabdex.bin" && test -s "$RUNNER_TEMP/aabres.bin"
          if grep -a -q -e 'ui/enginetest' -e 'EngineTestScreen' "$RUNNER_TEMP/aabdex.bin"; then echo "::error::Desarrollador en el AAB"; exit 1; fi
          if grep -a -q -e 'Prueba del motor' -e 'Mostrar Bienvenida otra vez' "$RUNNER_TEMP/aabres.bin"; then echo "::error::Textos de desarrollador en el AAB"; exit 1; fi

      # 16 KB: Play exige que las .so carguen en teléfonos con páginas de 16 KB.
      - name: Las librerías nativas están alineadas a 16 KB
        run: |
          readelf="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          bt=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          apk=app/build/outputs/apk/play/release/app-play-release-unsigned.apk
          test -f "$apk" || { echo "::error::No existe el APK play release"; exit 1; }
          "$ANDROID_HOME/build-tools/$bt/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
          mkdir -p "$RUNNER_TEMP/so" && unzip -o -q "$apk" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/so"
          n=0
          for so in "$RUNNER_TEMP"/so/lib/arm64-v8a/*.so; do
            n=$((n+1))
            # Alineación del LOAD (última columna, hex): se compara con printf, portable (mawk no trae strtonum).
            for al in $("$readelf" -l -W "$so" | awk '$1=="LOAD" { print $NF }'); do
              [ $((al)) -ge 16384 ] || { echo "::error::$so no está alineada a 16 KB"; exit 1; }
            done
          done
          test "$n" -ge 2

      - name: El APK release trae los motores arm64
        run: |
          apk=app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libct2bridge.so"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libslimtbridge.so"

      # R8 ofusca los nombres de clase en release, así que además se busca texto de las pantallas
      # de desarrollador en resources.arsc (los textos no se ofuscan).
      - name: El release no incluye la pantalla de desarrollador
        run: |
          apk=app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          # Control positivo: sin APK o sin resources.arsc, los grep de abajo pasarían en vacío.
          test -f "$apk" || { echo "::error::No existe el APK release"; exit 1; }
          unzip -l "$apk" resources.arsc > /dev/null || { echo "::error::El APK release no trae resources.arsc"; exit 1; }
          # Se extrae a archivos antes del grep: con pipefail, grep -q cierra la tubería al primer
          # hallazgo, unzip muere por SIGPIPE y el if lo tomaría como "no encontrado".
          unzip -p "$apk" 'classes*.dex' > "$RUNNER_TEMP/dex.bin"
          unzip -p "$apk" resources.arsc > "$RUNNER_TEMP/arsc.bin"
          if grep -a -q -e 'ui/enginetest' -e 'ui/developer' -e 'EngineTestScreen' "$RUNNER_TEMP/dex.bin"; then
            echo "::error::La versión release incluye código de la pantalla de desarrollador"; exit 1
          fi
          if grep -a -q -e 'Prueba del motor' -e 'Mostrar Bienvenida otra vez' "$RUNNER_TEMP/arsc.bin"; then
            echo "::error::La versión release incluye textos de la pantalla de desarrollador"; exit 1
          fi

      - name: Reporte de verificación de dependencias (si falló)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-verification-report
          path: build/reports/dependency-verification/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-fdroid-release-unsigned
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          if-no-files-found: error
