name: firefox-model

# Espeja los modelos oficiales de Firefox Translations (Mozilla) para un par.
# Se corre a mano: Actions > firefox-model > Run workflow > elegir el par.
on:
  workflow_dispatch:
    inputs:
      pair:
        description: "Par de idiomas"
        required: true
        type: choice
        options:
          - en-es
          - es-en

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar el par
        id: par
        env:
          PAIR_INPUT: ${{ inputs.pair }}
        run: |
          if [[ ! "$PAIR_INPUT" =~ ^(en-es|es-en)$ ]]; then
            echo "Par no permitido" >&2
            exit 1
          fi
          echo "pair=$PAIR_INPUT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          zstd --version

      - name: Pruebas del script
        working-directory: tools/models
        run: python -m unittest -v test_fetch_firefox

      - name: Bajar y verificar el modelo de Mozilla
        env:
          PAIR: ${{ steps.par.outputs.pair }}
        run: python tools/models/fetch_firefox.py --pair "$PAIR" --out out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-${{ steps.par.outputs.pair }}
          path: out/firefox-${{ steps.par.outputs.pair }}/
          if-no-files-found: error
          retention-days: 90
