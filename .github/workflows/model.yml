name: model

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "Par de idiomas (solo en-es: Helsinki-NLP no publica opus-mt-tc-big-es-en)"
        required: true
        type: choice
        default: en-es
        options:
          - en-es
  pull_request:
    paths:
      - "tools/models/**"
      - "bench/sustitutos.txt"
      - ".github/workflows/model.yml"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar el par
        id: par
        env:
          PAIR_INPUT: ${{ inputs.pair || 'en-es' }}
        run: |
          if [[ ! "$PAIR_INPUT" =~ ^(en-es)$ ]]; then
            echo "Par no permitido" >&2
            exit 1
          fi
          echo "pair=$PAIR_INPUT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias con huellas
        run: |
          python -m pip install --no-deps --require-hashes \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r tools/models/requirements.txt

      - name: Pruebas del script
        working-directory: tools/models
        run: python -m unittest -v test_convert_opus

      - name: Convertir el modelo
        env:
          PAIR: ${{ steps.par.outputs.pair }}
        run: python tools/models/convert_opus.py --pair "$PAIR" --out out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modelo-${{ steps.par.outputs.pair }}
          path: |
            out/${{ steps.par.outputs.pair }}.tar.zst
            out/${{ steps.par.outputs.pair }}/SHA256SUMS
            out/reference-outputs.txt
          if-no-files-found: error
          retention-days: 90
